<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#1a0505">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="الحشد الفاطمي - محتوى ديني من الحرمات المقدسة">
  <title>الحشد الفاطمي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="icons/icon-72x72.png">
  <style>
    /* ===== CSS Variables - Dark (Default) ===== */
    :root {
      --bg-primary: #0d0d0d;
      --bg-secondary: rgba(20, 20, 20, 0.6);
      --bg-card: rgba(30, 30, 30, 0.45);
      --bg-card-hover: rgba(40, 40, 40, 0.6);
      --border-color: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(139, 0, 0, 0.4);
      --text-primary: #f0f0f0;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --accent: #8B0000;
      --accent-light: #b30000;
      --accent-glow: rgba(139, 0, 0, 0.3);
      --gold: #c9a227;
      --shadow: rgba(0,0,0,0.4);
      --glass-blur: 16px;
    }

    /* ===== Light Mode ===== */
    [data-theme="light"] {
      --bg-primary: #f5f0eb;
      --bg-secondary: rgba(255, 255, 255, 0.6);
      --bg-card: rgba(255, 255, 255, 0.5);
      --bg-card-hover: rgba(255, 255, 255, 0.7);
      --border-color: rgba(0, 0, 0, 0.08);
      --border-hover: rgba(139, 0, 0, 0.3);
      --text-primary: #1a1a1a;
      --text-secondary: #555;
      --text-muted: #888;
      --accent: #8B0000;
      --accent-light: #a50000;
      --accent-glow: rgba(139, 0, 0, 0.15);
      --shadow: rgba(0,0,0,0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tahoma', sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.4s ease, color 0.4s ease;
    }

    /* ===== Background Pattern ===== */
    .bg-pattern {
      position: fixed; inset: 0; z-index: 0;
      background-image: 
        radial-gradient(circle at 20% 30%, rgba(139,0,0,0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(139,0,0,0.05) 0%, transparent 50%);
      pointer-events: none;
    }

    /* ===== Header ===== */
    .app-header {
      position: relative; z-index: 10;
      padding: 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-area {
      display: flex; align-items: center; gap: 10px;
    }
    .logo-img {
      width: 44px; height: 44px;
      border-radius: 50%;
      border: 2px solid var(--accent);
      object-fit: cover;
      box-shadow: 0 0 12px var(--accent-glow);
    }
    .logo-text {
      font-size: 1.15rem; font-weight: 800;
      color: var(--text-primary);
      letter-spacing: -0.5px;
    }
    .header-actions {
      display: flex; align-items: center; gap: 8px;
    }
    .icon-btn {
      width: 38px; height: 38px;
      border-radius: 50%;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: all 0.2s;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ===== Announcement Bar ===== */
    .announcement-bar {
      margin: 0 16px 12px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 10px 14px;
      display: none;
      align-items: center; gap: 10px;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      position: relative; z-index: 10;
      animation: slideDown 0.4s ease;
    }
    .announcement-bar.active { display: flex; }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-10px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .announcement-bar .bell { font-size: 1rem; }
    .announcement-bar .text {
      flex: 1; font-size: 0.85rem;
      color: var(--text-secondary);
    }
    .announcement-bar .close-ann {
      background: none; border: none;
      color: var(--text-muted); font-size: 1rem;
      cursor: pointer; padding: 2px;
    }

    /* ===== Search ===== */
    .search-box {
      margin: 0 16px 16px;
      display: flex; align-items: center; gap: 10px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 4px 4px 4px 14px;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      position: relative; z-index: 10;
    }
    .search-box input {
      flex: 1; background: none; border: none;
      color: var(--text-primary); font-family: inherit;
      font-size: 0.9rem; padding: 8px 0; outline: none;
    }
    .search-box input::placeholder { color: var(--text-muted); }
    .search-box .search-icon {
      width: 32px; height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: var(--text-muted); font-size: 1rem;
    }

    /* ===== Section Groups ===== */
    .section-group {
      margin-bottom: 20px;
      position: relative; z-index: 10;
    }
    .section-header-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 10px;
    }
    .section-label {
      display: flex; align-items: center; gap: 8px;
      font-size: 1rem; font-weight: 700;
      color: var(--text-primary);
    }
    .section-label .sec-icon { font-size: 1.2rem; }
    .section-count {
      font-size: 0.75rem; color: var(--text-muted);
      background: var(--bg-card);
      padding: 3px 10px;
      border-radius: 20px;
      border: 1px solid var(--border-color);
    }

    /* ===== Folder Cards (Horizontal Scroll) ===== */
    .folders-scroll {
      display: flex;
      gap: 10px;
      padding: 0 16px;
      overflow-x: auto;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
    }
    .folders-scroll::-webkit-scrollbar { display: none; }
    .folder-chip {
      flex: 0 0 auto;
      min-width: 140px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      padding: 16px 14px;
      text-align: center;
      cursor: pointer;
      scroll-snap-align: start;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: all 0.25s ease;
    }
    .folder-chip:hover, .folder-chip:active {
      background: var(--bg-card-hover);
      border-color: var(--border-hover);
      transform: translateY(-2px);
      box-shadow: 0 6px 20px var(--shadow);
    }
    .folder-chip .f-icon { font-size: 2rem; margin-bottom: 8px; }
    .folder-chip .f-name {
      font-weight: 700; font-size: 0.85rem;
      color: var(--text-primary);
      white-space: nowrap;
    }
    .folder-chip .f-count {
      font-size: 0.7rem; color: var(--text-muted);
      margin-top: 4px;
    }
    .folder-chip.empty {
      opacity: 0.5;
      border-style: dashed;
    }

    /* ===== Content Pages ===== */
    .page-container {
      display: none;
      padding: 0 16px 100px;
      position: relative; z-index: 10;
      animation: fadeIn 0.3s ease;
    }
    .page-container.active { display: block; }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .breadcrumb {
      display: flex; align-items: center; gap: 8px;
      padding: 8px 0 14px;
    }
    .breadcrumb .back-btn {
      display: flex; align-items: center; gap: 4px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 6px 12px;
      border-radius: 10px;
      font-family: inherit; font-size: 0.8rem;
      cursor: pointer; backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }
    .breadcrumb .crumb { color: var(--accent-light); font-weight: 600; font-size: 0.9rem; }

    /* ===== Media Grid ===== */
    .media-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }
    .media-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      overflow: hidden;
      cursor: pointer;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: all 0.2s;
    }
    .media-card:hover, .media-card:active {
      border-color: var(--border-hover);
      transform: scale(1.02);
    }
    .media-card img {
      width: 100%; height: 130px;
      object-fit: cover; display: block;
    }
    .media-card .m-info { padding: 10px 12px; }
    .media-card .m-title {
      font-size: 0.8rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .media-card .m-desc {
      font-size: 0.72rem; color: var(--text-muted);
      margin-top: 2px;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .media-card .private-tag {
      position: absolute; top: 6px; right: 6px;
      background: rgba(0,0,0,0.6);
      color: var(--gold); font-size: 0.65rem;
      padding: 2px 8px; border-radius: 6px;
      border: 1px solid var(--gold);
    }

    /* ===== Audio List ===== */
    .audio-list { display: flex; flex-direction: column; gap: 8px; }
    .audio-row {
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      cursor: pointer;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
      transition: all 0.2s;
    }
    .audio-row:hover { border-color: var(--border-hover); }
    .audio-row img {
      width: 48px; height: 48px;
      border-radius: 10px; object-fit: cover;
      background: rgba(255,255,255,0.05);
    }
    .audio-row .a-info { flex: 1; min-width: 0; }
    .audio-row .a-title {
      font-weight: 600; font-size: 0.85rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .audio-row .a-desc {
      font-size: 0.75rem; color: var(--text-muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .audio-row .a-play {
      width: 36px; height: 36px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 50%;
      color: var(--accent-light);
      font-size: 0.9rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* ===== Empty State ===== */
    .empty-state {
      text-align: center; padding: 60px 20px;
      color: var(--text-muted);
    }
    .empty-state .e-icon { font-size: 3rem; margin-bottom: 12px; opacity: 0.4; }
    .empty-state .e-text { font-size: 0.95rem; }

    /* ===== Media Viewer ===== */
    .viewer-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.92);
      z-index: 1000;
      display: none; align-items: center; justify-content: center;
      flex-direction: column;
    }
    .viewer-overlay.active { display: flex; }
    .viewer-overlay .v-close {
      position: absolute; top: 16px; left: 16px;
      background: rgba(255,255,255,0.1);
      border: none; color: #fff;
      width: 40px; height: 40px;
      border-radius: 50%; font-size: 1.3rem;
      cursor: pointer; z-index: 10;
    }
    .viewer-overlay .v-content {
      flex: 1; width: 100%;
      display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .viewer-overlay .v-content img,
    .viewer-overlay .v-content video {
      max-width: 100%; max-height: 70vh;
      border-radius: 12px;
    }
    .viewer-overlay .v-title {
      position: absolute; bottom: 80px;
      left: 0; right: 0; text-align: center;
      color: #fff; font-weight: 600; padding: 0 20px;
      text-shadow: 0 2px 8px rgba(0,0,0,0.8);
    }
    .viewer-overlay .v-actions {
      display: flex; gap: 12px;
      padding: 16px; position: absolute; bottom: 0;
      left: 0; right: 0; justify-content: center;
      background: linear-gradient(transparent, rgba(0,0,0,0.7));
    }
    .v-actions button {
      display: flex; align-items: center; gap: 6px;
      background: rgba(255,255,255,0.1);
      border: 1px solid rgba(255,255,255,0.2);
      color: #fff; padding: 10px 18px;
      border-radius: 10px; font-family: inherit;
      font-size: 0.85rem; cursor: pointer;
    }
    .v-actions button.primary {
      background: var(--accent-glow);
      border-color: var(--accent);
      color: #fff;
    }

    /* ===== Audio Player Bar ===== */
    .player-bar {
      position: fixed; bottom: 68px; left: 10px; right: 10px;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 10px 14px;
      display: none; align-items: center; gap: 12px;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .player-bar.active { display: flex; }
    .player-bar img {
      width: 40px; height: 40px;
      border-radius: 8px; object-fit: cover;
    }
    .player-bar .p-info { flex: 1; min-width: 0; }
    .player-bar .p-title {
      font-size: 0.8rem; font-weight: 600;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .player-bar .p-progress {
      flex: 1; height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px; margin-top: 4px;
      cursor: pointer;
    }
    .player-bar .p-progress-bar {
      height: 100%; width: 0%;
      background: var(--accent);
      border-radius: 2px;
    }
    .player-bar .p-controls {
      display: flex; align-items: center; gap: 6px;
    }
    .player-bar .p-controls button {
      width: 30px; height: 30px;
      background: var(--accent-glow);
      border: 1px solid var(--accent);
      border-radius: 50%;
      color: var(--accent-light);
      font-size: 0.8rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }

    /* ===== Bottom Nav ===== */
    .bottom-nav {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--bg-secondary);
      border-top: 1px solid var(--border-color);
      display: flex; justify-content: space-around;
      padding: 6px 0 14px;
      z-index: 100;
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .bottom-nav button {
      display: flex; flex-direction: column; align-items: center;
      gap: 2px; background: none; border: none;
      color: var(--text-muted); font-family: inherit;
      font-size: 0.6rem; cursor: pointer;
      padding: 4px 14px; transition: color 0.2s;
    }
    .bottom-nav button.active { color: var(--accent); }
    .bottom-nav button .n-icon { font-size: 1.2rem; }

    /* ===== Admin Login ===== */
    .admin-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.85);
      z-index: 2000;
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .admin-overlay.active { display: flex; }
    .login-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 20px;
      padding: 32px 24px;
      width: 100%; max-width: 320px;
      text-align: center;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }
    .login-box img {
      width: 60px; height: 60px;
      border-radius: 50%; border: 2px solid var(--accent);
      margin-bottom: 16px;
    }
    .login-box h2 { color: var(--accent-light); font-size: 1.1rem; margin-bottom: 20px; }
    .login-box input {
      width: 100%; padding: 12px 14px; margin-bottom: 10px;
      background: rgba(255,255,255,0.05);
      border: 1px solid var(--border-color);
      border-radius: 10px; color: var(--text-primary);
      font-family: inherit; font-size: 0.9rem; outline: none;
    }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button {
      width: 100%; padding: 12px;
      background: var(--accent);
      color: #fff; border: none;
      border-radius: 10px; font-family: inherit;
      font-weight: 700; font-size: 0.95rem;
      cursor: pointer; margin-top: 4px;
    }
    .login-box .err {
      color: var(--accent-light); font-size: 0.8rem;
      margin-top: 10px; display: none;
    }
    .login-box .err.active { display: block; }

    /* ===== Toast ===== */
    .toast {
      position: fixed; bottom: 86px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 10px 20px;
      border-radius: 12px;
      font-size: 0.85rem; font-weight: 600;
      z-index: 3000;
      transition: transform 0.3s ease;
      white-space: nowrap;
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      color: var(--text-primary);
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }
    .toast.active { transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: #27ae60; color: #2ecc71; }
    .toast.bad { border-color: var(--accent); color: var(--accent-light); }

    /* ===== Install Button ===== */
    .install-btn {
      position: fixed; top: 16px; left: 16px;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      color: var(--text-secondary);
      padding: 8px 14px;
      border-radius: 10px;
      font-family: inherit; font-weight: 600;
      font-size: 0.75rem; cursor: pointer;
      z-index: 50; display: none;
      backdrop-filter: blur(var(--glass-blur));
      -webkit-backdrop-filter: blur(var(--glass-blur));
    }
    .install-btn.active { display: block; }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>

  <button class="install-btn" id="install-btn">📲 تثبيت</button>

  <header class="app-header">
    <div class="logo-area" id="app-logo">
      <img src="icons/icon-192x192.png" alt="شعار" class="logo-img">
      <span class="logo-text">الحشد الفاطمي</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="theme-toggle" title="تبديل النمط">🌙</button>
    </div>
  </header>

  <div class="announcement-bar" id="announcement-bar">
    <span class="bell">🔔</span>
    <span class="text" id="ann-text"></span>
    <button class="close-ann" onclick="closeAnnouncement()">✕</button>
  </div>

  <div class="search-box">
    <input type="text" id="search-input" placeholder="بحث...">
    <div class="search-icon">🔍</div>
  </div>

  <!-- HOME -->
  <div id="page-home" class="page-container active">
    <div id="home-content"></div>
  </div>

  <!-- Dynamic Pages -->
  <div id="dynamic-pages"></div>

  <!-- ABOUT -->
  <div id="page-about" class="page-container">
    <div class="breadcrumb">
      <button class="back-btn" onclick="goHome()">← رجوع</button>
    </div>
    <div style="text-align:center;padding:40px 20px 80px;">
      <img src="icons/icon-192x192.png" alt="" style="width:90px;height:90px;border-radius:24px;border:2px solid var(--accent);margin-bottom:20px;">
      <h2 style="color:var(--accent-light);margin-bottom:12px;">الحشد الفاطمي</h2>
      <p style="color:var(--text-secondary);line-height:1.8;font-size:0.9rem;">تطبيق يضم محتوى ديني من الحرمات المقدسة</p>
      <p style="color:var(--text-muted);font-size:0.8rem;margin-top:20px;">الإصدار 3.0.0.0</p>
    </div>
  </div>

  <!-- Viewer -->
  <div class="viewer-overlay" id="viewer-overlay">
    <button class="v-close" id="v-close">✕</button>
    <div class="v-content" id="v-content"></div>
    <div class="v-title" id="v-title"></div>
    <div class="v-actions" id="v-actions"></div>
  </div>

  <!-- Audio Player -->
  <div class="player-bar" id="player-bar">
    <img src="" alt="" id="p-cover">
    <div class="p-info">
      <div class="p-title" id="p-title">عنوان</div>
      <div class="p-progress" id="p-progress"><div class="p-progress-bar" id="p-progress-bar"></div></div>
    </div>
    <div class="p-controls">
      <button id="p-prev">⏮</button>
      <button id="p-play">▶</button>
      <button id="p-next">⏭</button>
    </div>
  </div>

  <!-- Admin Login -->
  <div class="admin-overlay" id="admin-overlay">
    <div class="login-box">
      <img src="icons/icon-192x192.png" alt="">
      <h2>لوحة الإدارة</h2>
      <input type="text" id="admin-user" placeholder="اسم المستخدم" autocomplete="off">
      <input type="password" id="admin-pass" placeholder="كلمة المرور" autocomplete="off">
      <button id="admin-login">دخول</button>
      <div class="err" id="admin-err">بيانات غير صحيحة</div>
