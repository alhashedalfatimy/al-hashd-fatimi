<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="description" content="الحشد الفاطمي - محتوى ديني من الحرمات المقدسة">
  <title>الحشد الفاطمي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/logo-new.png">
  <link rel="icon" type="image/png" href="icons/logo-new.png">
  <style>
    :root {
      --bg: #0a0a0a;
      --bg-sec: rgba(20, 20, 20, 0.45);
      --card: rgba(255, 255, 255, 0.06);
      --card-hover: rgba(255, 255, 255, 0.12);
      --border: rgba(255, 255, 255, 0.08);
      --border-hover: rgba(139, 0, 0, 0.5);
      --text: #ffffff;
      --text2: #b0b0b0;
      --text3: #555;
      --accent: #8B0000;
      --accent-light: #a50000;
      --accent-glow: rgba(139, 0, 0, 0.25);
      --gold: #c9a227;
      --blur: 24px;
    }
    [data-theme="light"] {
      --bg: #f0f0f0;
      --bg-sec: rgba(255, 255, 255, 0.55);
      --card: rgba(255, 255, 255, 0.5);
      --card-hover: rgba(255, 255, 255, 0.75);
      --border: rgba(0, 0, 0, 0.06);
      --border-hover: rgba(139, 0, 0, 0.3);
      --text: #111111;
      --text2: #555;
      --text3: #999;
      --accent: #8B0000;
      --accent-light: #a50000;
      --accent-glow: rgba(139, 0, 0, 0.15);
      --gold: #b8960f;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Tahoma', sans-serif;
      background: var(--bg); color: var(--text);
      min-height: 100vh; overflow-x: hidden;
      -webkit-tap-highlight-color: transparent;
      transition: background 0.4s ease, color 0.4s ease;
    }
    .bg-glow {
      position: fixed; inset: 0; z-index: 0;
      background:
        radial-gradient(circle at 20% 10%, rgba(139,0,0,0.12) 0%, transparent 45%),
        radial-gradient(circle at 80% 90%, rgba(139,0,0,0.06) 0%, transparent 40%);
      pointer-events: none;
    }
    .glass {
      background: var(--card);
      border: 1px solid var(--border);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border-radius: 16px;
      transition: all 0.3s ease;
    }
    .glass:hover {
      border-color: var(--border-hover);
      background: var(--card-hover);
    }
    .app-header {
      position: relative; z-index: 10;
      padding: 14px 16px;
      display: flex; align-items: center; justify-content: space-between;
    }
    .logo-area { display: flex; align-items: center; gap: 10px; cursor: pointer; }
    .logo-img {
      width: 46px; height: 46px; border-radius: 50%;
      border: 2px solid var(--accent); object-fit: cover;
      box-shadow: 0 0 15px var(--accent-glow);
    }
    .logo-text { font-size: 1.1rem; font-weight: 800; color: var(--text); letter-spacing: -0.3px; }
    .header-actions { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--card); border: 1px solid var(--border);
      color: var(--text2); font-size: 1.1rem;
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      transition: all 0.25s ease;
    }
    .icon-btn:hover { border-color: var(--accent); color: var(--accent); transform: scale(1.05); }
    .ann-bar {
      margin: 0 16px 10px; padding: 10px 14px;
      display: none; align-items: center; gap: 10px;
      position: relative; z-index: 10;
      animation: slideDown 0.35s ease;
    }
    .ann-bar.on { display: flex; }
    @keyframes slideDown { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
    .ann-bar .bell { font-size: 1rem; }
    .ann-bar .txt { flex: 1; font-size: 0.82rem; color: var(--text2); }
    .ann-bar .x { background: none; border: none; color: var(--text3); font-size: 0.9rem; cursor: pointer; }
    .search-box {
      margin: 0 16px 14px; display: flex; align-items: center; gap: 10px;
      padding: 4px 4px 4px 14px; position: relative; z-index: 10;
    }
    .search-box input {
      flex: 1; background: none; border: none;
      color: var(--text); font-family: inherit;
      font-size: 0.9rem; padding: 8px 0; outline: none;
    }
    .search-box input::placeholder { color: var(--text3); }
    .search-box .si { color: var(--text3); font-size: 1rem; }
    .sec-group { margin-bottom: 18px; position: relative; z-index: 10; }
    .sec-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 16px 8px;
    }
    .sec-label { display: flex; align-items: center; gap: 8px; font-size: 0.95rem; font-weight: 700; color: var(--text); }
    .sec-label .ic { font-size: 1.1rem; }
    .sec-count {
      font-size: 0.72rem; color: var(--text3); background: var(--card);
      padding: 3px 10px; border-radius: 20px; border: 1px solid var(--border);
    }
    .folders-row {
      display: flex; gap: 10px; padding: 0 16px;
      overflow-x: auto; scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch; scrollbar-width: none;
    }
    .folders-row::-webkit-scrollbar { display: none; }
    .folder-chip {
      flex: 0 0 auto; min-width: 150px; padding: 18px 14px;
      text-align: center; cursor: pointer; scroll-snap-align: start;
      transition: all 0.3s ease;
    }
    .folder-chip:hover, .folder-chip:active {
      border-color: var(--border-hover); transform: translateY(-3px);
      box-shadow: 0 12px 32px rgba(0,0,0,0.2);
    }
    .folder-chip .fic { font-size: 2rem; margin-bottom: 8px; }
    .folder-chip .fnm { font-weight: 700; font-size: 0.82rem; white-space: nowrap; color: var(--text); }
    .folder-chip .fcnt { font-size: 0.68rem; color: var(--text3); margin-top: 4px; }
    .folder-chip.empty { opacity: 0.4; border-style: dashed; }
    .page { display: none; padding: 0 16px 100px; position: relative; z-index: 10; animation: fadeIn 0.3s ease; }
    .page.on { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
    .breadcrumb { display: flex; align-items: center; gap: 8px; padding: 8px 0 12px; }
    .breadcrumb .back {
      display: flex; align-items: center; gap: 4px; padding: 6px 12px;
      border-radius: 10px; font-family: inherit; font-size: 0.78rem;
      cursor: pointer; backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      background: var(--card); border: 1px solid var(--border); color: var(--text2);
    }
    .breadcrumb .crumb { color: var(--accent-light); font-weight: 700; font-size: 0.88rem; }
    .m-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
    .m-card {
      overflow: hidden; cursor: pointer;
      transition: all 0.25s ease; position: relative;
    }
    .m-card:hover, .m-card:active {
      border-color: var(--border-hover); transform: scale(1.02);
      box-shadow: 0 8px 24px rgba(0,0,0,0.15);
    }
    .m-card img { width: 100%; height: 125px; object-fit: cover; display: block; }
    .m-card .mi { padding: 9px 12px; }
    .m-card .mt { font-size: 0.78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .m-card .md { font-size: 0.7rem; color: var(--text3); margin-top: 2px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .a-list { display: flex; flex-direction: column; gap: 8px; }
    .a-row {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 14px; cursor: pointer; transition: all 0.25s ease;
    }
    .a-row:hover { border-color: var(--border-hover); }
    .a-row img { width: 48px; height: 48px; border-radius: 10px; object-fit: cover; background: rgba(255,255,255,0.04); }
    .a-row .ai { flex: 1; min-width: 0; }
    .a-row .at { font-weight: 700; font-size: 0.85rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .a-row .ad { font-size: 0.75rem; color: var(--text3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .a-row .ap {
      width: 36px; height: 36px; background: var(--accent-glow);
      border: 1px solid var(--accent); border-radius: 50%;
      color: var(--accent-light); font-size: 0.85rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .empty { text-align: center; padding: 60px 20px; color: var(--text3); }
    .empty .ei { font-size: 3.5rem; margin-bottom: 12px; opacity: 0.3; }
    .empty .et { font-size: 0.9rem; }
    .viewer {
      position: fixed; inset: 0; background: rgba(0,0,0,0.94);
      z-index: 1000; display: none; align-items: center; justify-content: center; flex-direction: column;
    }
    .viewer.on { display: flex; }
    .viewer .vc { position: absolute; top: 14px; left: 14px; background: rgba(255,255,255,0.08); border: none; color: #fff; width: 40px; height: 40px; border-radius: 50%; font-size: 1.3rem; cursor: pointer; z-index: 10; }
    .viewer .vcon { flex: 1; width: 100%; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .viewer .vcon img, .viewer .vcon video { max-width: 100%; max-height: 68vh; border-radius: 12px; }
    .viewer .vt { position: absolute; bottom: 76px; left: 0; right: 0; text-align: center; color: #fff; font-weight: 700; padding: 0 20px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); font-size: 0.95rem; }
    .viewer .va { display: flex; gap: 10px; padding: 14px; position: absolute; bottom: 0; left: 0; right: 0; justify-content: center; background: linear-gradient(transparent, rgba(0,0,0,0.7)); }
    .viewer .va button { display: flex; align-items: center; gap: 5px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15); color: #fff; padding: 9px 16px; border-radius: 10px; font-family: inherit; font-size: 0.82rem; cursor: pointer; }
    .viewer .va button.pri { background: var(--accent-glow); border-color: var(--accent); }
    .player {
      position: fixed; bottom: 66px; left: 10px; right: 10px;
      padding: 10px 14px; display: none; align-items: center; gap: 12px;
      z-index: 100; backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .player.on { display: flex; }
    .player img { width: 40px; height: 40px; border-radius: 8px; object-fit: cover; }
    .player .pi { flex: 1; min-width: 0; }
    .player .pt { font-size: 0.78rem; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .player .pp { flex: 1; height: 3px; background: rgba(255,255,255,0.08); border-radius: 2px; margin-top: 4px; cursor: pointer; }
    .player .ppb { height: 100%; width: 0%; background: var(--accent); border-radius: 2px; }
    .player .pc { display: flex; align-items: center; gap: 6px; }
    .player .pc button { width: 30px; height: 30px; background: var(--accent-glow); border: 1px solid var(--accent); border-radius: 50%; color: var(--accent-light); font-size: 0.8rem; display: flex; align-items: center; justify-content: center; cursor: pointer; }
    .bnav {
      position: fixed; bottom: 0; left: 0; right: 0;
      display: flex; justify-content: space-around;
      padding: 6px 0 14px; z-index: 100;
      backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px);
    }
    .bnav button { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: var(--text3); font-family: inherit; font-size: 0.58rem; cursor: pointer; padding: 4px 14px; transition: color 0.2s; }
    .bnav button.on { color: var(--accent); }
    .bnav button .ni { font-size: 1.2rem; }
    .admin-ol {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88);
      z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px;
    }
    .admin-ol.on { display: flex; }
    .login-box {
      width: 100%; max-width: 320px; text-align: center; padding: 30px 22px;
    }
    .login-box img { width: 64px; height: 64px; border-radius: 50%; border: 2px solid var(--accent); margin-bottom: 14px; }
    .login-box h2 { color: var(--accent-light); font-size: 1.05rem; margin-bottom: 18px; }
    .login-box input { width: 100%; padding: 12px 14px; margin-bottom: 10px; background: rgba(255,255,255,0.04); border: 1px solid var(--border); border-radius: 10px; color: var(--text); font-family: inherit; font-size: 0.9rem; outline: none; }
    .login-box input:focus { border-color: var(--accent); }
    .login-box button { width: 100%; padding: 12px; background: var(--accent); color: #fff; border: none; border-radius: 10px; font-family: inherit; font-weight: 700; font-size: 0.95rem; cursor: pointer; transition: opacity 0.2s; }
    .login-box button:hover { opacity: 0.9; }
    .login-box .err { color: var(--accent-light); font-size: 0.8rem; margin-top: 10px; display: none; }
    .login-box .err.on { display: block; }
    .toast {
      position: fixed; bottom: 84px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 10px 22px; border-radius: 12px;
      font-size: 0.85rem; font-weight: 700;
      z-index: 3000; transition: transform 0.3s ease;
      white-space: nowrap; background: var(--bg-sec);
      border: 1px solid var(--border); color: var(--text);
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
    }
    .toast.show { transform: translateX(-50%) translateY(0); }
    .toast.ok { border-color: #27ae60; color: #2ecc71; }
    .toast.bad { border-color: var(--accent); color: var(--accent-light); }
    .install-btn {
      position: fixed; top: 14px; left: 14px;
      padding: 7px 14px; border-radius: 10px; font-family: inherit;
      font-weight: 700; font-size: 0.75rem;
      cursor: pointer; z-index: 50; display: none;
      backdrop-filter: blur(var(--blur)); -webkit-backdrop-filter: blur(var(--blur));
      background: var(--card); border: 1px solid var(--border); color: var(--text2);
    }
    .install-btn.on { display: block; }
    @media (min-width: 768px) {
      .m-grid { grid-template-columns: repeat(3, 1fr); gap: 14px; }
      .folders-row { gap: 14px; }
      .folder-chip { min-width: 180px; padding: 22px 18px; }
      .app-header { padding: 18px 24px; }
      .search-box, .ann-bar { margin: 0 24px 14px; }
      .sec-header { padding: 0 24px 10px; }
      .folders-row { padding: 0 24px; }
      .page { padding: 0 24px 100px; }
    }
    @media (min-width: 1024px) {
      .m-grid { grid-template-columns: repeat(4, 1fr); gap: 16px; }
      body { max-width: 900px; margin: 0 auto; }
    }
    @media (max-width: 360px) {
      .logo-text { font-size: 0.95rem; }
      .m-grid { grid-template-columns: repeat(1, 1fr); }
      .folder-chip { min-width: 130px; padding: 14px 10px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>
  <button class="install-btn glass" id="install-btn">📲 تثبيت</button>
  <header class="app-header">
    <div class="logo-area" id="app-logo">
      <img src="icons/logo-new.png" alt="الحشد الفاطمي" class="logo-img">
      <span class="logo-text">الحشد الفاطمي</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn glass" id="theme-toggle" title="تبديل النمط">🌙</button>
    </div>
  </header>
  <div class="ann-bar glass" id="ann-bar">
    <span class="bell">🔔</span>
    <span class="txt" id="ann-txt"></span>
    <button class="x" onclick="closeAnn()">✕</button>
  </div>
  <div class="search-box glass">
    <input type="text" id="search-input" placeholder="بحث...">
    <div class="si">🔍</div>
  </div>
  <div id="page-home" class="page on">
    <div id="home-content"></div>
  </div>
  <div id="dynamic-pages"></div>
  <div id="page-about" class="page">
    <div class="breadcrumb">
      <button class="back glass" onclick="goHome()">← رجوع</button>
    </div>
    <div style="text-align:center;padding:40px 20px 80px;">
      <img src="icons/logo-new.png" alt="" style="width:100px;height:100px;border-radius:50%;border:3px solid var(--accent);margin-bottom:20px;box-shadow:0 0 20px var(--accent-glow);">
      <h2 style="color:var(--accent-light);margin-bottom:10px;">الحشد الفاطمي</h2>
      <p style="color:var(--text2);line-height:1.8;font-size:0.88rem;">محتوى ديني من الحرمات المقدسة</p>
      <p style="color:var(--text3);font-size:0.78rem;margin-top:24px;">الإصدار 3.0.0.0</p>
    </div>
  </div>
  <div class="viewer" id="viewer">
    <button class="vc" id="vc">✕</button>
    <div class="vcon" id="vcon"></div>
    <div class="vt" id="vt"></div>
    <div class="va" id="va"></div>
  </div>
  <div class="player glass" id="player">
    <img src="" alt="" id="p-cover">
    <div class="pi">
      <div class="pt" id="p-title">عنوان</div>
      <div class="pp" id="pp"><div class="ppb" id="ppb"></div></div>
    </div>
    <div class="pc">
      <button id="p-prev">⏮</button>
      <button id="p-play">▶</button>
      <button id="p-next">⏭</button>
    </div>
  </div>
  <div class="admin-ol" id="admin-ol">
    <div class="login-box glass">
      <img src="icons/logo-new.png" alt="">
      <h2>لوحة الإدارة</h2>
      <input type="text" id="admin-user" placeholder="اسم المستخدم" autocomplete="off">
      <input type="password" id="admin-pass" placeholder="كلمة المرور" autocomplete="off">
      <button id="admin-login">دخول</button>
      <div class="err" id="admin-err">بيانات غير صحيحة</div>
    </div>
  </div>
  <div class="toast" id="toast"></div>
  <nav class="bnav glass">
    <button class="on" data-page="home" onclick="goHome()">
      <span class="ni">🏠</span><span>الرئيسية</span>
    </button>
    <button data-page="about" onclick="navTo('about')">
      <span class="ni">ℹ️</span><span>عن التطبيق</span>
    </button>
  </nav>
  <script src="js/db.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
