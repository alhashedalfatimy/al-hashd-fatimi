<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0c0c0c">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>لوحة الإدارة - الحشد الفاطمي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="icons/icon-72x72.png">
  <style>
    :root {
      --gold: #d4af37;
      --gold-light: #f0d878;
      --gold-dark: #b8962e;
      --primary-black: #0c0c0c;
      --secondary-black: #1a1a1a;
      --card-bg: rgba(26,26,26,0.9);
      --glass-bg: rgba(26,26,26,0.7);
      --glass-border: rgba(212,175,55,0.15);
      --text-primary: #f5f5f5;
      --text-secondary: #a0a0a0;
      --text-muted: #666;
      --danger: #c0392b;
      --success: #27ae60;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', 'Tahoma', sans-serif;
      background: var(--primary-black);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    .bg-gradient {
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at top, rgba(212,175,55,0.06) 0%, transparent 60%);
      pointer-events: none; z-index: 0;
    }
    .admin-main { position: relative; z-index: 1; min-height: 100vh; padding-bottom: 40px; }

    /* Header */
    .admin-header {
      display: flex; align-items: center; justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--glass-border);
    }
    .admin-header .title {
      display: flex; align-items: center; gap: 12px;
      color: var(--gold); font-weight: 700; font-size: 1.2rem;
    }
    .admin-header .title img {
      width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--gold);
    }
    .logout-btn {
      background: rgba(192,57,43,0.15);
      color: #e74c3c; border: 1px solid rgba(192,57,43,0.3);
      padding: 8px 18px; border-radius: 8px;
      font-family: inherit; cursor: pointer; font-weight: 600;
    }

    /* Breadcrumb */
    .breadcrumb {
      display: flex; align-items: center; gap: 10px;
      padding: 12px 20px; margin: 8px 0;
    }
    .back-btn {
      background: rgba(212,175,55,0.1);
      border: 1px solid rgba(212,175,55,0.2);
      color: var(--gold); padding: 6px 14px;
      border-radius: 8px; font-family: inherit;
      font-weight: 600; font-size: 0.85rem; cursor: pointer;
    }
    .crumb { color: var(--gold); font-weight: 600; }
    .crumb-sep { color: var(--text-muted); }

    /* Page Title */
    .page-title {
      padding: 8px 20px 12px;
      font-size: 1.1rem; font-weight: 700; color: var(--text-primary);
    }

    /* Cards */
    .admin-card {
      display: flex; align-items: center; justify-content: space-between;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 14px;
      padding: 16px 20px;
      margin: 8px 16px;
      cursor: pointer;
      transition: all 0.2s;
    }
    .admin-card:hover {
      border-color: rgba(212,175,55,0.3);
      transform: translateX(-3px);
    }
    .card-info {
      display: flex; align-items: center; gap: 14px;
    }
    .card-icon {
      width: 48px; height: 48px;
      background: rgba(212,175,55,0.1);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      font-size: 1.6rem;
    }
    .card-name { font-weight: 700; color: var(--text-primary); font-size: 1rem; }
    .card-meta { font-size: 0.8rem; color: var(--text-secondary); margin-top: 2px; }
    .card-actions {
      display: flex; gap: 6px;
    }
    .action-btn {
      width: 36px; height: 36px;
      border-radius: 8px; border: none;
      font-size: 1rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .action-btn.edit { background: rgba(212,175,55,0.15); }
    .action-btn.delete { background: rgba(192,57,43,0.15); }

    /* Add FAB */
    .add-fab {
      display: flex; align-items: center; justify-content: center; gap: 8px;
      margin: 16px;
      padding: 16px;
      background: linear-gradient(135deg, rgba(212,175,55,0.15), rgba(212,175,55,0.05));
      border: 2px dashed var(--gold);
      border-radius: 14px;
      color: var(--gold);
      font-weight: 700; font-size: 0.95rem;
      cursor: pointer; font-family: inherit;
      transition: all 0.2s;
    }
    .add-fab:hover { background: linear-gradient(135deg, rgba(212,175,55,0.25), rgba(212,175,55,0.1)); }

    /* Media Item Card */
    .media-item-card {
      display: flex; align-items: center; gap: 12px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 12px;
      padding: 12px 16px;
      margin: 8px 16px;
    }
    .media-item-card img, .thumb-placeholder {
      width: 56px; height: 56px;
      border-radius: 10px; object-fit: cover;
      background: rgba(255,255,255,0.05);
      display: flex; align-items: center; justify-content: center;
      font-size: 1.4rem;
    }
    .media-info { flex: 1; min-width: 0; }
    .media-title {
      font-weight: 600; font-size: 0.9rem;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .media-desc { font-size: 0.78rem; color: var(--text-secondary); margin-top: 2px; }
    .delete-btn {
      width: 36px; height: 36px;
      background: rgba(192,57,43,0.15);
      border: none; border-radius: 8px;
      color: #e74c3c; font-size: 1rem;
      cursor: pointer;
    }

    /* Upload Area */
    .upload-area {
      margin: 16px;
      padding: 32px 20px;
      border: 2px dashed rgba(212,175,55,0.25);
      border-radius: 14px;
      text-align: center;
      cursor: pointer;
      background: rgba(212,175,55,0.03);
      transition: all 0.2s;
    }
    .upload-area:hover { border-color: var(--gold); background: rgba(212,175,55,0.06); }
    .upload-icon { font-size: 2rem; margin-bottom: 8px; }
    .upload-text { color: var(--text-secondary); font-size: 0.9rem; }

    /* Empty State */
    .empty-state {
      text-align: center; padding: 50px 20px;
      color: var(--text-secondary);
    }
    .empty-state .icon { font-size: 3.5rem; margin-bottom: 12px; opacity: 0.5; }
    .empty-state .text { font-size: 1rem; }

    /* Modal */
    .modal-overlay {
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.9);
      z-index: 1000;
      display: none; align-items: center; justify-content: center;
      padding: 20px;
    }
    .modal-overlay.active { display: flex; }
    .modal-content {
      width: 100%; max-width: 400px;
      background: var(--card-bg);
      border: 1px solid var(--glass-border);
      border-radius: 16px;
      padding: 24px;
      position: relative;
    }
    .modal-close {
      position: absolute; top: 16px; left: 16px;
      background: none; border: none;
      color: var(--text-secondary); font-size: 1.2rem;
      cursor: pointer;
    }
    .modal-title {
      color: var(--gold); font-size: 1.15rem;
      font-weight: 700; margin-bottom: 20px;
      text-align: center;
    }
    .form-group { margin-bottom: 14px; }
    .form-label {
      display: block; color: var(--text-secondary);
      font-size: 0.85rem; margin-bottom: 6px;
    }
    .form-input, .form-select {
      width: 100%;
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid rgba(212,175,55,0.25);
      background: rgba(255,255,255,0.05);
      color: var(--text-primary);
      font-family: inherit; font-size: 0.95rem;
      outline: none;
    }
    .form-input:focus, .form-select:focus { border-color: var(--gold); }
    .submit-btn {
      width: 100%; padding: 14px;
      background: linear-gradient(135deg, var(--gold), var(--gold-dark));
      color: var(--primary-black);
      border: none; border-radius: 10px;
      font-family: inherit; font-weight: 700;
      font-size: 1rem; cursor: pointer;
    }

    /* Toast */
    .toast {
      position: fixed; bottom: 24px; left: 50%;
      transform: translateX(-50%) translateY(100px);
      padding: 12px 24px;
      border-radius: 12px;
      color: white; font-weight: 600;
      z-index: 2000;
      transition: transform 0.3s;
      white-space: nowrap;
      background: var(--secondary-black);
      border: 1px solid var(--glass-border);
    }
    .toast.active { transform: translateX(-50%) translateY(0); }
    .toast.success { border-color: var(--success); color: #2ecc71; }
    .toast.error { border-color: var(--danger); color: #e74c3c; }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="admin-main" id="admin-main">
    <div class="admin-header">
      <div class="title">
        <img src="icons/icon-192x192.png" alt="شعار">
        <span>لوحة الإدارة</span>
      </div>
      <button class="logout-btn" id="admin-logout">خروج</button>
    </div>
    <div id="admin-view"></div>
  </div>

  <div class="modal-overlay" id="modal-overlay">
    <div class="modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <h3 class="modal-title" id="modal-title">عنوان</h3>
      <div id="modal-body"></div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
