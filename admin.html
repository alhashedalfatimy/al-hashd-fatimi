<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>لوحة الإدارة - الحشد الفاطمي</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
  <link rel="icon" type="image/png" href="icons/icon-72x72.png">
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { background: var(--primary-black); }
    .admin-main { min-height: 100vh; }
    .folder-select { width: 100%; padding: 12px; border-radius: 8px; border: 1px solid var(--gold); background: var(--glass-bg); color: var(--text-primary); font-family: inherit; }
    .section-card, .folder-card { display: flex; align-items: center; justify-content: space-between; padding: 16px; margin-bottom: 12px; }
    .section-card .info, .folder-card .info { display: flex; align-items: center; gap: 12px; }
    .section-card .icon { font-size: 1.5rem; }
    .section-card .name, .folder-card .name { font-weight: 600; color: var(--text-primary); }
    .section-card .actions, .folder-card .actions { display: flex; gap: 8px; }
    .admin-action-btn { padding: 6px 14px; border-radius: 6px; border: none; cursor: pointer; font-family: inherit; font-size: 0.85rem; }
    .admin-action-btn.edit { background: var(--gold); color: var(--primary-black); }
    .admin-action-btn.delete { background: #c0392b; color: white; }
    .add-btn { width: 100%; padding: 14px; margin-bottom: 16px; background: rgba(212,175,55,0.15); border: 2px dashed var(--gold); border-radius: 12px; color: var(--gold); font-weight: 600; cursor: pointer; font-family: inherit; }
    .add-btn:hover { background: rgba(212,175,55,0.25); }
    .tab-section { margin-bottom: 24px; }
    .tab-section h3 { color: var(--gold); margin-bottom: 12px; font-size: 1.1rem; }
  </style>
</head>
<body>
  <div class="bg-gradient"></div>
  <div class="bg-noise"></div>

  <div class="admin-main" id="admin-main">
    <!-- Admin Header -->
    <div class="admin-header">
      <div style="display:flex;align-items:center;gap:12px;">
        <img src="icons/icon-192x192.png" alt="شعار" style="width:40px;height:40px;border-radius:10px;border:1px solid var(--gold);">
        <span style="color:var(--gold);font-weight:700;font-size:1.2rem;">لوحة الإدارة</span>
      </div>
      <button class="submit-btn" id="admin-logout" style="padding:10px 24px;font-size:0.9rem;">خروج</button>
    </div>

    <!-- Admin Nav -->
    <div class="admin-nav">
      <button class="admin-nav-btn active" data-tab="content">📝 المحتوى</button>
      <button class="admin-nav-btn" data-tab="sections">⚙️ الأقسام</button>
      <button class="admin-nav-btn" data-tab="folders">📁 المجلدات</button>
    </div>

    <!-- Tab: Content -->
    <div class="admin-content" id="tab-content">
      <div style="margin-bottom:16px;">
        <label style="color:var(--text-secondary);display:block;margin-bottom:8px;">القسم:</label>
        <select class="folder-select" id="content-section-select">
          <option value="images">🖼 الصور</option>
          <option value="videos">🎥 الفيديوهات</option>
          <option value="audios">🎧 المقاطع الصوتية</option>
        </select>
      </div>
      <div style="margin-bottom:16px;">
        <label style="color:var(--text-secondary);display:block;margin-bottom:8px;">المجلد (اختياري):</label>
        <select class="folder-select" id="content-folder-select">
          <option value="">📂 بدون مجلد (عام)</option>
        </select>
      </div>
      <div class="upload-area" id="upload-area">
        <div class="upload-icon">📤</div>
        <div class="upload-text">اسحب الملفات هنا أو اضغط للاختيار</div>
        <input type="file" id="file-input" multiple accept="image/*,video/*,audio/*" style="display:none;">
      </div>
      <div id="admin-content"></div>
    </div>

    <!-- Tab: Sections -->
    <div class="admin-content" id="tab-sections" style="display:none;">
      <button class="add-btn" id="add-section-btn">+ إضافة قسم جديد</button>
      <div id="sections-list"></div>
    </div>

    <!-- Tab: Folders -->
    <div class="admin-content" id="tab-folders" style="display:none;">
      <div style="margin-bottom:16px;">
        <label style="color:var(--text-secondary);display:block;margin-bottom:8px;">القسم:</label>
        <select class="folder-select" id="folder-section-select">
          <option value="images">🖼 الصور</option>
          <option value="videos">🎥 الفيديوهات</option>
          <option value="audios">🎧 المقاطع الصوتية</option>
        </select>
      </div>
      <button class="add-btn" id="add-folder-btn">+ إضافة مجلد جديد</button>
      <div id="folders-list"></div>
    </div>
  </div>

  <!-- Edit/Add Modal -->
  <div class="modal-overlay" id="modal-overlay">
    <div class="glass-panel modal-content">
      <button class="modal-close" id="modal-close">✕</button>
      <h3 class="modal-title" id="modal-title">إضافة محتوى</h3>
      <div id="modal-preview" style="margin-bottom:20px;text-align:center;"></div>
      <div class="form-group">
        <label class="form-label">العنوان</label>
        <input type="text" class="form-input" id="item-title" placeholder="عنوان المحتوى">
      </div>
      <div class="form-group">
        <label class="form-label">الوصف</label>
        <textarea class="form-textarea" id="item-desc" placeholder="وصف المحتوى"></textarea>
      </div>
      <div class="form-group" id="folder-select-group" style="display:none;">
        <label class="form-label">المجلد</label>
        <select class="folder-select" id="item-folder-select">
          <option value="">بدون مجلد</option>
        </select>
      </div>
      <div style="display:flex;gap:16px;flex-wrap:wrap;margin:16px 0;">
        <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="item-hidden" style="width:18px;height:18px;accent-color:var(--gold);">
          <span>مخفي</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="item-featured" style="width:18px;height:18px;accent-color:var(--gold);">
          <span>مميز</span>
        </label>
        <label style="display:flex;align-items:center;gap:8px;color:var(--text-secondary);cursor:pointer;">
          <input type="checkbox" id="item-latest" style="width:18px;height:18px;accent-color:var(--gold);" checked>
          <span>جديد</span>
        </label>
      </div>
      <button class="submit-btn" id="save-item-btn" style="width:100%;">حفظ</button>
    </div>
  </div>

  <!-- Section/Folder Modal -->
  <div class="modal-overlay" id="manage-modal-overlay">
    <div class="glass-panel modal-content">
      <button class="modal-close" id="manage-modal-close">✕</button>
      <h3 class="modal-title" id="manage-modal-title">إضافة</h3>
      <div class="form-group">
        <label class="form-label">الاسم</label>
        <input type="text" class="form-input" id="manage-name" placeholder="الاسم">
      </div>
      <div class="form-group" id="manage-icon-group">
        <label class="form-label">الأيقونة (emoji)</label>
        <input type="text" class="form-input" id="manage-icon" placeholder="🖼" maxlength="2">
      </div>
      <div class="form-group" id="manage-type-group" style="display:none;">
        <label class="form-label">نوع المحتوى</label>
        <select class="folder-select" id="manage-type">
          <option value="image">🖼 صور</option>
          <option value="video">🎥 فيديو</option>
          <option value="audio">🎧 صوت</option>
        </select>
      </div>
      <button class="submit-btn" id="manage-save-btn" style="width:100%;">حفظ</button>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast" id="toast"></div>

  <script src="js/db.js"></script>
  <script src="js/admin.js"></script>
</body>
</html>
